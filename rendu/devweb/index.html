<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TechCorp Financial Chat</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="shell">
      <aside class="sidebar" aria-label="Configuration du chat">
        <div class="brand-block">
          <p class="eyebrow brand-name">TechCorp Industries</p>
        </div>

        <section class="status-panel" aria-labelledby="statusTitle">
          <div class="panel-heading">
            <span id="statusTitle">Infrastructure</span>
            <span id="connectionLabel" class="pill">Verification...</span>
          </div>
          <div class="status-row">
            <span class="status-name"><span id="ollamaDot" class="dot"></span>Ollama</span>
            <span class="endpoint">:11434</span>
          </div>
          <div class="status-row">
            <span class="status-name"><span id="tritonDot" class="dot"></span>Triton</span>
            <span class="endpoint">:8000</span>
          </div>
        </section>

        <section class="controls" aria-label="Parametres d'inference">
          <label>
            Serveur
            <select id="provider">
              <option value="ollama">Ollama</option>
              <option value="triton">Triton</option>
            </select>
          </label>

          <div class="readonly-field" role="group" aria-label="Modele utilise">
            <span class="readonly-label">Modele</span>
            <span id="modelName" class="readonly-value">phi35-financial</span>
          </div>

          <label>
            <span class="label-line">
              Temperature
              <span id="tempValue" class="value-chip">0.40</span>
            </span>
            <input id="temperature" type="range" min="0" max="1" step="0.05" value="0.4" />
          </label>
        </section>

        <section class="quick-prompts" aria-labelledby="promptsTitle">
          <p id="promptsTitle" class="section-title">Prompts rapides</p>
          <button type="button" class="prompt-chip" data-prompt="Explique en francais, en 5 lignes maximum, pourquoi la diversification reduit le risque d'un portefeuille financier.">Diversification</button>
          <button type="button" class="prompt-chip" data-prompt="Analyse les principaux risques financiers d'une entreprise qui augmente fortement son endettement.">Risque dette</button>
          <button type="button" class="prompt-chip" data-prompt="Resume les indicateurs a regarder avant un investissement long terme.">Investissement</button>
        </section>

        <button id="clearBtn" class="secondary-action" type="button">Nouvelle conversation</button>
      </aside>

      <section class="chat">
        <header class="chat-header">
          <div>
            <p class="eyebrow">Assistant financier interne</p>
            <h2>Assistant financier</h2>
          </div>
          <div class="header-actions">
            <span id="activeProvider" class="backend-tag">Ollama</span>
          </div>
        </header>

        <div id="messages" class="messages" aria-live="polite" aria-label="Conversation"></div>

        <form id="chatForm" class="composer" aria-label="Envoyer un message">
          <div class="input-wrap">
            <textarea id="prompt" rows="2" placeholder="Posez une question financiere..." required></textarea>
          </div>
          <button id="sendBtn" type="submit">Envoyer</button>
        </form>
      </section>
    </main>

    <script src="./app.js"></script>
  </body>
</html>
